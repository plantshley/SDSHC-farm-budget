<!doctype html>
<html lang="en" data-theme="light" data-font="browser">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#afbf42" />
    <meta
      name="description"
      content="Build enterprise budgets, then save and compare scenarios — South Dakota Soil Health Coalition."
    />
    <title>Farm Budget Scenario Tool — SDSHC</title>
    <link rel="icon" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%sdshc-logo.png" />
    <!-- Linked here rather than imported from main.js so the entry module stays
         plain JS and can be imported directly by the Node smoke tests. -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- The band's background lives on this wrapper, not on .topbar. The bar is
         capped at --maxw and centred, so a background on it would stop at the
         content edge on a wide screen; and it cannot take the negative side
         margins that reach the window edge without making the page scroll
         sideways. This element exists for that one rule. See .topband in
         styles.css. -->
    <div class="topband">
      <div class="topbar">
        <!-- %BASE_URL% is substituted by Vite with the deployed base path. A
             "./"-relative URL resolves against the current page instead, which
             is wrong the moment the app is opened on any path but the site
             root. -->
        <!-- The same mark twice, one per width, the wrong one display: none —
             so exactly one is ever announced. The horizontal lockup needs about
             170px to stay legible and the phone has not got it to spare; the
             square mark is the same identity in 42px and gives the whole
             difference back to the row. Same idiom as the two copies of the
             seeds-per-unit offer. -->
        <img
          class="toplogo toplogo-wide"
          src="%BASE_URL%sdshc-logo-horizontal.png"
          alt="South Dakota Soil Health Coalition"
          width="763"
          height="200"
        />
        <img
          class="toplogo toplogo-mark"
          src="%BASE_URL%sdshc-logo.png"
          alt="South Dakota Soil Health Coalition"
          width="179"
          height="181"
        />
        <!-- Wide screens only. On a phone the bar is already the logo, a font
             control and a theme toggle wrapping onto two lines, and a title
             there would push the first thing on the page further down to repeat
             what the browser tab already says. -->
        <span class="topbar-title">Farm Budget Scenario Tool</span>
        <div class="topbar-controls">
          <div class="segmented" role="group" aria-label="Font">
            <span class="segmented-label">Font</span>
            <button type="button" class="seg" data-font-choice="browser" aria-pressed="true">Browser</button>
            <button type="button" class="seg" data-font-choice="classic" aria-pressed="false">Classic</button>
            <button type="button" class="seg" data-font-choice="mono" aria-pressed="false">Mono</button>
          </div>
          <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            aria-pressed="false"
            aria-label="Switch to dark mode"
            title="Dark mode"
          ></button>
        </div>
      </div>
    </div>

    <main id="app"></main>

    <!-- Author tool, hidden behind a secret gesture and linked to from no
         screen. Loaded BEFORE main.js so any saved palette override is on
         <html> before the first render, and kept out of main.js so the entry
         module the smoke tests import stays exactly what it was. -->
    <script type="module" src="/src/themelab.js"></script>
    <!-- The second hidden panel, on the same terms: no screen links to it, and
         it is kept out of main.js so the entry module the smoke tests import
         stays plain. Unlike themelab it reads real data, so the gesture is only
         how it OPENS — firestore.rules and a password are what gate it. Its
         Firebase imports are dynamic, so a producer who never opens it never
         downloads the SDK. See the header of exporter.js. -->
    <script type="module" src="/src/exporter.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
