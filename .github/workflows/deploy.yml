name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must be >= 21: `npm test` runs `node --test "test/**/*.test.js"`, and
          # the test runner only expands glob patterns from v21 on. On Node 20 the
          # pattern is treated as a literal path, so the step fails with
          # "Could not find ...\test\**\*.test.js" and the deploy never runs.
          # 22 also matches the version the suite is developed against.
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run model tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
